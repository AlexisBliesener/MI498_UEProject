name: Build Project

on:
  workflow_dispatch: 
  push:
    branches: # aA
      - main         
  pull_request:      

jobs:
  build-and-package:
    runs-on: self-hosted 

    steps:
      - name: download reppoo
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: get lfs cache
        run: git lfs install && git config --global url."https://${{ github.token }}@github.com/".insteadOf "https://github.com/" && git lfs pull

      - name: start packaging the porject
        uses: OrchidIsle/UE5-Build-Project@latest
        with:
          RUNUAT_PATH: 'D:/Epic Games/UE_5.7/Engine/Build/BatchFiles/RunUAT.bat'
          UPROJECT_PATH: ${{ github.workspace }}/MI498_UEProject.uproject
          BUILD_CONFIG: Development
          PLATFORM: Win64
          CLEAN: false
          COOK: true
          STAGE: true
          PACKAGE: true
          NULLRHI: true
      - name: cache stats
        run: octocache stats