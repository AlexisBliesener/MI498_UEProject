name: Build Project

on:
  workflow_dispatch: 
  push:
    branches: 
      - main         
  pull_request:      

concurrency:
  group: unreal-engine-build
  cancel-in-progress: false

jobs:
  start-azure-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          
      - name: start VM
        run: |
          echo "Starting azure VM..."
          az vm start --resource-group MI498_UEProject --name WindowsWithUnrealInstalled

  build-and-package:
    needs: start-azure-vm
    runs-on: self-hosted 

    steps:
      - name: download repo
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: get lfs cache
        working-directory: ${{ github.workspace }}
        run: |
            git lfs install
            git lfs pull

      - name: start packaging the project
        env:
          UE-LocalDataCachePath: "F:\\UE_Cache"
        run: |
          & "F:\UE_5.7\Engine\Build\BatchFiles\RunUAT.bat" BuildCookRun -project="${{ github.workspace }}\MI498_UEProject.uproject" -noP4 -platform=Win64 -clientconfig=Development -build -cook -stage -package -nullrhi -iterate -AdditionalCookerOptions="-cookprocesscount=4"

  stop-azure-vm:
    needs: [start-azure-vm, build-and-package]
    if: always() 
    runs-on: ubuntu-latest
    steps:
      - name: Login to azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          
      - name: Check for new jobs and stop VM
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        run: |
          QUEUED=$(gh api repos/${{ github.repository }}/actions/runs?status=queued --jq '.total_count')
          
          echo "THERE ARE $QUEUED ACTIONS DON'T DELETE THIS "
          
          if [ "$QUEUED" -gt 0 ]; then
            echo "FOUND AN ACTION, DON'T STOP AZZURE VM "
          else
            echo "no vm"
            az vm deallocate --resource-group MI498_UEProject --name WindowsWithUnrealInstalled
          fi